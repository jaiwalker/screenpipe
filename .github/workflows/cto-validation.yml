name: CTO validation layer
on:
  push:
    branches: ['cto/**']
    paths: ['scripts/cto/**', 'cto-release.json', '.github/workflows/cto-validation.yml']
  pull_request:
    paths: ['scripts/cto/**', 'cto-release.json', '.github/workflows/cto-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun test scripts/cto/
